name: Contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "tests/contract/**"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "tests/contract/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  release-manifest:
    name: Validate FSP contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out exact FSP 3.1.0 source
        uses: actions/checkout@v4
        with:
          repository: Andreas-bersgtedt/Fabric-Shortcut-Proxy
          ref: 8bb0474558c274666d6625a763a8ca9f02481c83
          path: .fsp-test-fixture

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/contract/requirements.txt
            .fsp-test-fixture/pyproject.toml
            .fsp-test-fixture/enterprise/pyproject.toml

      - name: Install contract test dependencies
        run: |
          python -m pip install --requirement tests/contract/requirements.txt
          python -m pip install --editable .fsp-test-fixture --editable .fsp-test-fixture/enterprise

      - name: Regenerate OpenAPI contracts
        run: |
          python scripts/export-fsp-openapi.py --fsp-test-source .fsp-test-fixture
          git diff --exit-code -- contracts/fsp/3.1.0/openapi-*.json

      - name: Run contract tests
        run: python -m unittest discover --start-directory tests/contract --pattern "test_*.py" --verbose

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install client generation dependencies
        run: npm ci

      - name: Regenerate and compile typed clients
        run: |
          npm run check:fsp-clients
          npm run typecheck

      - name: Run FSP 3.1.0 runtime contracts
        env:
          FSP_TEST_SOURCE: ${{ github.workspace }}/.fsp-test-fixture
        run: npm run test:fsp-runtime

      - name: Upload bounded redacted failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fsp-contract-logs
          path: artifacts/fsp-contract-logs
          if-no-files-found: ignore
          retention-days: 7
